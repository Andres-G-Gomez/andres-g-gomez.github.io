<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#5ee7df"/>
      <stop offset="100%" stop-color="#b490ca"/>
    </linearGradient>
  </defs>
  <rect rx="24" ry="24" width="800" height="450" fill="url(#g)"/>
  <g transform="translate(36,36)">
    <rect width="728" height="378" rx="16" fill="#ffffff" opacity="0.08"/>
    <rect x="20" y="20" width="240" height="48" rx="10" fill="#ffffff" opacity="0.12"/>
    <text x="40" y="54" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#fff" font-weight="700">Legal Intake Assistant</text>

    <!-- chat bubble -->
    <g transform="translate(20,100)">
      <rect x="0" y="0" width="520" height="220" rx="14" fill="#ffffff" opacity="0.14"/>
      <rect x="16" y="16" width="488" height="120" rx="10" fill="#ffffff"/>
      <text x="28" y="48" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">Hello. I am here to help lawyers look at your</text>
      <text x="28" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">immigration case. I will ask questions about</text>
      <text x="28" y="88" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">your life and your past so the lawyers can</text>
      <text x="28" y="108" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">understand your story.</text>

      <!-- microphone circle -->
      <circle cx="472" cy="164" r="26" fill="#2d9cdb"/>
      <path d="M468 154 a1 1 0 0 1 8 0 v8 a8 8 0 0 1 -8 0 z" fill="#fff"/>
    </g>

    <text x="40" y="340" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#fff" font-weight="600">Aliados — Trauma-Informed Legal Intake</text>
  </g>
</svg>